site_name: NDB-UFES Data Organizer
site_description: The rebuilt NDB-UFES and SAB patch dataset, its case groups and leakage-aware folds
site_url: https://beamaia.github.io/ndb_ufes_data_organizer/
repo_url: https://github.com/beamaia/ndb_ufes_data_organizer
repo_name: GitHub

theme:
  name: material
  locale: en
  logo: assets/branding/labcin-mark.png
  favicon: assets/branding/labcin-mark.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - styles/labcin.css

extra:
  social:
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/lab/Nature-inspired-Computing-Lab-Labcin-Renato-Krohling
      name: Labcin on ResearchGate

nav:
  - Home: index.md
  - Dataset:
    - About the Data: about-the-data.md
    - Factsheet NDB-UFES: factsheet-ndb-ufes.md
    - Factsheet P-NDB-UFES: factsheet-p-ndb-ufes.md
    - Matching and Atlases: matching-and-atlases.md
  - Folds:
    - Old Folds and Contamination: old-folds.md
    - New Folds: folds.md
  - Reference:
    - Data Dictionary: data-dictionary.md
  - Use It:
    - Setup & Installation: setup.md
    - Reproducibility: reproducibility.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - tables
  - codehilite
  - meta
  - admonition
  - toc:
      permalink: true

