site_name: NDB-UFES Data Organizer
site_description: Stratified folding pipeline for oral cancer histopathology dataset
site_url: https://beamaia.github.io/ndb_ufes_data_organizer/
repo_url: https://github.com/beamaia/ndb_ufes_data_organizer
repo_name: GitHub

theme:
  name: material
  locale: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Start Here:
    - Factsheet: factsheet.md
    - Setup & Installation: setup.md
  - Pipeline:
    - Overview: pipeline.md
    - Implementation Status: status.md
    - Reproducibility: reproducibility.md
  - Implementation:
    - Phase 1:
      - Code: phase1-code.md
      - Results: phase1-results.md
    - Phase 2: phase2-code.md
    - Phase 3: phase3-code.md
    - Fold Structure: fold-structure-explained.md
  - Reference:
    - Data Dictionary: data-dictionary.md
    - Exploratory Analysis: exploratory-analysis.md
    - Contamination Checks: contamination-analysis.md
    - Audit Guide: audit-guide.md
    - Visualizations: visualizations/README.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - codehilite
  - meta
  - admonition
  - toc:
      permalink: true

copyright: Copyright © 2026 NDB-UFES Data Organizer Team
