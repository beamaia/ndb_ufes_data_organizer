site_name: NDB-UFES Data Organizer
site_description: Leakage-aware folds and reproducibility notes for the NDB-UFES oral histopathology dataset
site_url: https://beamaia.github.io/ndb_ufes_data_organizer/
repo_url: https://github.com/beamaia/ndb_ufes_data_organizer
repo_name: GitHub

theme:
  name: material
  locale: en
  logo: assets/branding/labcin-mark.png
  favicon: assets/branding/labcin-mark.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - styles/labcin.css

extra_javascript:
  - javascripts/plotly-loader.js

# Keep local-only review and non-release visualization assets out of the
# public Pages artifact.
exclude_docs: |
  assets/contamination/contaminated_patches_comparison.png
  visualizations/

extra:
  social:
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/lab/Nature-inspired-Computing-Lab-Labcin-Renato-Krohling
      name: Labcin on ResearchGate

nav:
  - Home: index.md
  - Start Here:
    - Factsheet: factsheet.md
    - Setup & Installation: setup.md
    - Thesis Experiment Design: thesis-experiment-batches.md
    - Canonical Experiment Results: experiment-results.md
  - Final Release:
    - Output Status: status.md
    - Reproducibility: reproducibility.md
  - Reference:
    - Data Dictionary: data-dictionary.md
    - Contamination Checks: contamination-analysis.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - tables
  - codehilite
  - meta
  - admonition
  - toc:
      permalink: true

