site_name: NDB-UFES Data Organizer
site_description: Patient-first atlas, leakage-aware folds, and reproducibility notes for the NDB-UFES oral histopathology dataset
site_url: https://beamaia.github.io/ndb_ufes_data_organizer/
repo_url: https://github.com/beamaia/ndb_ufes_data_organizer
repo_name: GitHub

theme:
  name: material
  locale: en
  logo: assets/branding/labcin-mark.png
  favicon: assets/branding/labcin-mark.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - styles/labcin.css

extra_javascript:
  - javascripts/plotly-loader.js

# Keep this unreferenced, high-resolution review composite in the repository for
# local review without copying 29 MB into every public Pages artifact.
exclude_docs: |
  assets/contamination/contaminated_patches_comparison.png
  assets/thesis_section3/README.md
  assets/thesis_section3/asset_manifest.csv
  assets/thesis_section3/fig_02_collapsed_wsi_groups_0010_0013.png
  assets/thesis_section3/fig_02_related_shifted_wsi_groups_0010_0013.png
  assets/thesis_section3/fig_07_metadata_missingness_combined.pdf
  assets/thesis_section3/fig_07_metadata_missingness_combined.png

extra:
  social:
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/lab/Nature-inspired-Computing-Lab-Labcin-Renato-Krohling
      name: Labcin on ResearchGate

nav:
  - Home: index.md
  - Start Here:
    - Factsheet: factsheet.md
    - Setup & Installation: setup.md
    - Atlas Guide: atlas-guide.md
    - Atlas Methods: atlas-methods.md
    - Atlas Index: atlas-index.md
    - Current Release Facts: release-facts.md
    - Atlas Gap Map: atlas-gap-map.md
    - Metadata Conflict Review: metadata-conflict-review.md
    - Thesis Experiment Design: thesis-experiment-batches.md
    - Canonical Experiment Results: experiment-results.md
  - Pipeline:
    - Overview: pipeline.md
    - Implementation Status: status.md
    - Reproducibility: reproducibility.md
  - Implementation:
    - Phase 1:
      - Code: phase1-code.md
      - Results: phase1-results.md
    - Phase 2:
      - Code: phase2-code.md
      - Results: phase2-results.md
      - Tuning Diagnostics: phase2-tuning-diagnostics.md
    - Phase 3:
      - Code: phase3-code.md
      - Results: phase3-results.md
    - Fold Structure: fold-structure-explained.md
  - Reference:
    - Data Dictionary: data-dictionary.md
    - Exploratory Analysis: exploratory-analysis.md
    - Dataset Figure Gallery: dataset-figure-gallery.md
    - Contamination Checks: contamination-analysis.md
    - Validation Guide: validation-guide.md
    - Visualizations: visualizations/README.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - tables
  - codehilite
  - meta
  - admonition
  - toc:
      permalink: true

