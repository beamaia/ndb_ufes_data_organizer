[project]
name = "ndb-ufes-data-organizer"
version = "0.1.0"
description = "Leakage-safe fold organization pipeline for the NDB-UFES oral histopathology dataset."
readme = "readme.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==2.2.1",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "scipy>=1.10.0",
    "dvc==3.58.0",
    "dvc-s3==3.2.0",
    "boto3==1.35.88",
    "botocore==1.35.88",
    "opencv-python==4.10.0.84",
    "scikit-image==0.25.1",
    "pillow>=12.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.13.0",
    "seaborn>=0.13.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "huggingface-hub>=1.1.0",
    "timm==1.0.26",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aenum>=3.1.11",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pygments>=2.18.0",
]

[tool.uv]
package = false
