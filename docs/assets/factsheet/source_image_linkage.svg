<text x="823.7" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">652 (17.3%)</text>
<rect x="175" y="390" width="18" height="18" rx="3" fill="#365cc1"/>
<text x="202" y="404" font-size="13">Public NDB-UFES + SAB evidence</text>
